name = "portal"
main = "worker.ts"
compatibility_date = "2024-11-18"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "portal-db"
database_id = "cde94290-17b3-4626-9a62-5bb83e68380b"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "portal-storage"

[vars]
AUTH_URL = "https://portal.stann.kr"

[version_metadata]
binding = "CF_VERSION_METADATA"
