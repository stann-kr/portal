name = "portal"
main = "worker.ts"
compatibility_date = "2024-11-18"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "portal-db"
database_id = "cde94290-17b3-4626-9a62-5bb83e68380b"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "portal-storage"

# wrangler.toml과 같게: 사용자 접속 지점과 관계없이 D1 가까이에서 실행한다.
[placement]
mode = "smart"

# 문서별 실시간 공동 편집 room(Yjs). 클래스는 worker.ts가 export한다.
# 운영 첫 배포 때 v1 migration으로 SQLite 저장소 DO가 만들어진다(DEPLOYMENT 승인 항목).
[[durable_objects.bindings]]
name = "DOC_ROOMS"
class_name = "DocumentRoom"

[[migrations]]
tag = "v1-document-rooms"
new_sqlite_classes = ["DocumentRoom"]

[vars]
AUTH_URL = "https://portal.stann.kr"
ACCOUNT_DELETION_ENABLED = "false"

[[ratelimits]]
name = "ACCOUNT_CLEANUP_RATE_LIMITER"
namespace_id = "2026081101"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "PASSWORD_ATTEMPT_RATE_LIMITER"
namespace_id = "2026101401"

  [ratelimits.simple]
  limit = 10
  period = 60

# wrangler.toml과 같게: 학생 가입 링크 메일(Cloudflare Email Service). 이 설정으로 올린 version도 메일을 보낼 수 있어야 한다.
[[send_email]]
name = "EMAIL"

[observability]
enabled = true
head_sampling_rate = 1

  [observability.logs]
  invocation_logs = true

[version_metadata]
binding = "CF_VERSION_METADATA"
